services:
  postgres:
    image: postgres:17-alpine
    container_name: quickdialog-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: quickdialog
      POSTGRES_PASSWORD: quickdialog
      POSTGRES_DB: quickdialog

    ports:
      - '6342:5432'

    volumes:
      - quickdialog_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quickdialog -d quickdialog']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  quickdialog_postgres_data:
